# dsh-session-delete bundle patch.
#
# 一个 host 侧空行：让本包成为 cordis loader entry（dsh-client-modules 只扫描
# ACTIVE loader entry 里声明 dsh.client 的包），从而把浏览器端 client.js
# 编入 window.__DSH_BOOT__ 并挂到 /plugins/dsh-session-delete/client.js。
- insert:
    - id: dsh-session-delete
      name: dsh-session-delete
      config:
        enabled: true
